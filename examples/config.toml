# The shape of /etc/alyosha/config.toml. In the container, write the same values as
# services.alyosha.settings in Nix; for development on the host, point ALYOSHA_CONFIG at a copy.
# No secrets here: set them with `alyosha secret set <name>`.
# Every setting: docs/reference/Configuration.md. Alyosha never writes this file.

timezone = "Europe/Amsterdam"

[model]
provider = "chatgpt"   # the GPROXY provider `alyosha gateway login` creates
api = "codex"          # codex, openai, claudeapi, aistudio, or deepseek
name = "gpt-6.2-sol"
# effort = "high"     # low, medium, or high; codex and openai only. Unset: the provider's default

[gateway]
url = "http://127.0.0.1:18787"

[approvals]
timeout_minutes = 60

# The Telegram bridge (docs/TelegramBridge.md).
# [telegram]
# owner_id = 123456789          # the token is the secret telegram-token
#
# Groups whose members get your full powers, each working in work/groups/<name>.
# [telegram.trusted_groups]
# family = -1001234567890

# The QQ bridge (docs/QQBridge.md).
# [qq]
# app_id = "102000000"
# owner_openid = ""             # the AppSecret is the secret qq-secret
#
# [qq.trusted_groups]
# friends = "<group_openid>"

# Scheduled tasks (docs/Schedule.md#implementation).
[mcp.servers.schedule]
command = "alyosha-schedule"

# Web search (docs/WebSearch.md#implementation).
[mcp.servers.search]
command = "open-websearch"
tools = ["search"]

[mcp.servers.search.env]
MODE = "stdio"
SEARCH_MODE = "request"
DEFAULT_SEARCH_ENGINE = "duckduckgo"
ALLOWED_SEARCH_ENGINES = "bing,duckduckgo,brave,startpage,baidu"
MCP_TOOL_FETCH_WEB_NAME = "<disabled>"
MCP_TOOL_FETCH_GITHUB_NAME = "<disabled>"
MCP_TOOL_FETCH_CSDN_NAME = "<disabled>"
MCP_TOOL_FETCH_JUEJIN_NAME = "<disabled>"
MCP_TOOL_FETCH_LINUXDO_NAME = "<disabled>"

# What guest sessions in group chats may use (docs/Channels.md#group-chats).
# Only servers that reach no account of yours.
[guest]
mcp_servers = ["search"]

# The browser (docs/Browser.md#implementation). Public pages work with a temporary profile.
[mcp.servers.chromium]
command = "playwright-mcp"
args = [
  "--headless", "--sandbox", "--isolated", "--no-webmcp",
  "--output-dir", "/tmp/alyosha-playwright",
]
tools = [
  "browser_navigate", "browser_navigate_back", "browser_snapshot",
  "browser_click", "browser_type", "browser_fill_form", "browser_press_key",
  "browser_select_option", "browser_wait_for",
]

