# ~/.config/alyosha/config.toml — copy, fill in, and `chmod 600` it.
# Every setting: docs/reference/Configuration.md. Alyosha never writes this file.

timezone = "Europe/Amsterdam"

[model]
provider = "chatgpt"   # the GPROXY provider `alyosha gateway login` creates
api = "codex"          # codex, openai, claudeapi, aistudio, or deepseek
name = "gpt-6.2-sol"

[gateway]
url = "http://127.0.0.1:18787"

[approvals]
timeout_minutes = 60

# The Telegram bridge (docs/develop/TelegramBridge.md).
# [telegram]
# owner_id = 123456789
# workspace = "/home/you/work/alyosha-home"
# token = "..."

# The QQ bridge (docs/develop/QQBridge.md).
# [qq]
# app_id = "102000000"
# owner_openid = ""
# workspace = "/home/you/work/alyosha-qq"
# secret = "..."

# Scheduled tasks (docs/develop/Schedule.md).
[mcp.servers.schedule]
command = "alyosha-schedule"

# Web search (docs/develop/WebSearch.md).
[mcp.servers.search]
command = "open-websearch"
tools = ["search"]

[mcp.servers.search.env]
MODE = "stdio"
SEARCH_MODE = "request"
DEFAULT_SEARCH_ENGINE = "duckduckgo"
ALLOWED_SEARCH_ENGINES = "bing,duckduckgo,brave,startpage,baidu"
MCP_TOOL_FETCH_WEB_NAME = "<disabled>"
MCP_TOOL_FETCH_GITHUB_NAME = "<disabled>"
MCP_TOOL_FETCH_CSDN_NAME = "<disabled>"
MCP_TOOL_FETCH_JUEJIN_NAME = "<disabled>"
MCP_TOOL_FETCH_LINUXDO_NAME = "<disabled>"

# What guest sessions in group chats may use (docs/design/Channels.md#group-chats).
# Only servers that reach no account of yours.
[guest]
mcp_servers = ["search"]

# The browser (docs/develop/Browser.md). Public pages work with a temporary profile.
[mcp.servers.chromium]
command = "playwright-mcp"
args = [
  "--headless", "--sandbox", "--isolated", "--no-webmcp",
  "--output-dir", "/tmp/alyosha-playwright",
]
tools = [
  "browser_navigate", "browser_navigate_back", "browser_snapshot",
  "browser_click", "browser_type", "browser_fill_form", "browser_press_key",
  "browser_select_option", "browser_wait_for",
]

