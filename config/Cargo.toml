[package]
name = "alyosha-config"
version = "0.1.0"
edition = "2024"
description = "The configuration schema and loader shared by every Alyosha program"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std", "registry"] }

[dev-dependencies]
tempfile = "3.27.0"
