[workspace]
resolver = "3"
members = ["bridge", "config", "qq", "schedule", "telegram"]

[package]
name = "alyosha"
version = "0.1.0"
edition = "2024"
description = "A general-purpose personal assistant for NixOS"
publish = false

[dependencies]
alyosha-config = { path = "config" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
futures-util = "0.3.34"
getrandom = "0.4.3"
# Without default features, a schema can never fetch an external reference over HTTP or from a file.
jsonschema = { version = "0.63.1", default-features = false }
rpassword = "7.5.5"
rquickjs = { version = "0.14.0", features = ["futures", "parallel"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal", "fs", "io-std"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-chrono-0_4"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
