<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alyosha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Alyosha, a general-purpose personal assistant for NixOS: design and implementation notes.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    .markdown-section { max-width: 900px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section pre > code { font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'Alyosha',
      repo: 'MJLiiii/Alyosha',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 2,
      maxLevel: 3,
      // The pages link to each other relative to their own folder, as on GitHub.
      relativePath: true,
      auto2top: true,
      search: {
        paths: 'auto',
        depth: 3,
        placeholder: 'Search',
        noData: 'No results',
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false });</script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
</body>
</html>
